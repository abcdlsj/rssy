{{define "head"}}
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RSSy</title>
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css"
/>
<link rel="shortcut icon" type="image/x-icon" href="{{.SiteURL}}/favicon.ico" />
<style>
  body {
    font-family: Avenir, system-ui, -apple-system, BlinkMacSystemFont,
      "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans",
      "Helvetica Neue", sans-serif;
  }
  [hidden] {
    display: none !important;
  }
  .form-container {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
  }
  .unread-toggle {
    margin: 4px 0 14px;
  }
  .form-container label {
    margin-right: 4px;
    font-size: 0.9em;
  }
  .form-container input[type="text"],
  .form-container input[type="url"] {
    width: 240px;
    margin-right: 4px;
    font-size: 0.9em;
  }
  .form-container input[type="submit"] {
    font-size: 0.9em;
  }
  .navbar {
    overflow-x: auto;
    margin-bottom: 20px;
    white-space: nowrap;
  }
  .navbar a {
    display: inline-block;
    text-align: left;
    padding: 10px 15px 10px 0;
    text-decoration: none;
  }
  .feed-item {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding-bottom: 5px;
    margin: 0;
  }
  .feed-title {
    flex: 0 0 auto;
  }
  .feed-url {
    min-width: 0;
    color: #666;
    font-size: 0.9em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .feed-actions {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-left: auto;
  }
  .feed-actions form {
    display: inline;
    margin: 0;
  }
  .feed-actions select {
    min-width: 120px;
    padding: 2px 5px;
    font-size: 0.8em;
  }
  .import-export-container {
    display: flex;
    gap: 10px;
    padding-bottom: 5px;
    margin: 0;
  }
  .updatefeed-container {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    margin: 0;
  }
  .updatefeed-container .update-button,
  .refresh-button,
  .favorite-button {
    background: none;
    border: none;
    cursor: pointer;
    text-decoration: none;
    padding: 0 5px 0 0;
  }
  input[type="checkbox"] {
    accent-color: transparent;
  }
  .import-button,
  .export-button,
  .delete-button {
    background: none;
    border: none;
    cursor: pointer;
    text-decoration: none;
    padding: 0 5px 0 0;
  }
  .import-button:hover,
  .custom-file-upload:hover {
    text-decoration: none;
  }
  .custom-file-upload {
    background: none;
    border: none;
    cursor: pointer;
    text-decoration: none;
    padding: 0;
  }
  input[type="file"] {
    display: none;
  }
  .article-item {
    margin-bottom: 7px;
    line-height: 1.45;
  }
  .article-action-read,
  .article-action-delete,
  .article-action-favorite,
  .article-action-source {
    font-size: 0.9em;
    font-weight: 300;
    white-space: nowrap;
  }
  .article-action-favorite {
    background: none;
    border: none;
    color: var(--links);
    cursor: pointer;
    display: inline;
    margin: 0;
    padding: 0;
  }
  .article-info {
    font-size: 0.9em;
    font-weight: 300;
  }
  .article-feed {
    font-size: 0.9em;
    font-weight: 300;
    text-decoration: none;
  }
  .article-category {
    font-size: 0.85em;
    text-decoration: none;
  }
  .timeline-divider {
    margin: 18px 0 8px;
    color: #666;
    font-size: 0.85em;
    font-weight: bold;
  }
  .article-content {
    padding: 20px;
    max-width: 800px;
    margin: auto;
  }
  .article-title {
    font-size: 1.5em;
    margin-bottom: 10px;
  }
  .article-meta {
    font-size: 0.9em;
    margin-bottom: 20px;
  }
  .article-body {
    line-height: 1.6;
  }
  .category-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 12px 0 16px;
  }
  .category-tab {
    min-height: 30px;
    display: inline-flex;
    align-items: center;
    gap: 3px;
    background: var(--button-base);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text-main);
    cursor: pointer;
    margin: 0;
    padding: 4px 8px;
    font-size: 0.8em;
    line-height: 1;
    text-decoration: none;
  }
  .category-tab.active {
    background: var(--selection);
    font-weight: bold;
  }
  .category-select {
    min-height: 30px;
    margin: 0;
    padding: 3px 6px;
    font-size: 0.8em;
  }
  .tab-color,
  .category-tag-color {
    display: inline-block;
    width: 9px;
    height: 9px;
    margin-right: 3px;
    border-radius: 50%;
  }
  .stream-container {
    display: flex;
    margin-top: 20px;
  }
  .sidebar {
    width: 200px;
    flex: 0 0 auto;
    padding-right: 20px;
    border-right: 1px solid #ccc;
  }
  .stream-group-main-content {
    flex: 1;
    min-width: 0;
    padding-left: 20px;
    padding-top: 5%;
  }
  .group-header {
    cursor: pointer;
    padding: 5px 0;
    margin-bottom: 5px;
  }
  .group-header:hover {
    background-color: #f0f0f0;
  }
  .group-header.active {
    font-weight: bold;
    background-color: #e0e0e0;
  }
  .group-content {
    display: none;
  }
  .group-content.active {
    display: block;
  }
  .stream-item {
    margin-bottom: 8px;
  }
  .stream-summary {
    font-size: 1em;
    text-decoration: none;
  }
  .stream-summary a {
    text-decoration: none;
  }
  .stream-summary a.visited,
  .article-link.visited {
    color: #808080;
  }
  .stream-info {
    font-size: 0.9em;
    color: #666;
    margin-left: 10px;
  }
  .stream-title {
    font-size: 0.8em;
    color: #666;
    text-decoration: none;
  }
  .empty-state {
    color: #666;
    font-size: 0.9em;
  }
  .inline-form {
    display: inline;
  }
  .system-marker {
    font-size: 0.75em;
    opacity: 0.6;
  }
  @media (prefers-color-scheme: dark) {
    .group-header:hover,
    .group-header.active {
      background-color: #2d3748;
    }
    .sidebar {
      border-color: #4a5568;
    }
    .feed-url,
    .timeline-divider,
    .stream-info,
    .stream-title,
    .empty-state {
      color: #a0aec0;
    }
  }
  @media (max-width: 640px) {
    .stream-container {
      display: block;
    }
    .sidebar {
      width: auto;
      padding: 0 0 10px;
      border-right: 0;
      border-bottom: 1px solid #ccc;
    }
    .stream-group-main-content {
      padding: 20px 0 0;
    }
    .feed-item {
      display: block;
      margin-bottom: 10px;
    }
    .feed-url {
      display: block;
      white-space: normal;
      overflow-wrap: anywhere;
    }
    .feed-actions {
      display: flex;
      margin: 4px 0 0;
    }
    .form-container {
      align-items: flex-start;
    }
  }
</style>
<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"
  media="(prefers-color-scheme: dark)"
/>
<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/mono-blue.min.css"
  media="(prefers-color-scheme: light), (prefers-color-scheme: no-preference)"
/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
  if (window.hljs) {
    hljs.highlightAll();
  }

  document.addEventListener("DOMContentLoaded", function () {
    const links = document.querySelectorAll(".stream-item .stream-summary a, .article-link");
    links.forEach((link) => {
      if (localStorage.getItem(link.href)) {
        link.classList.add("visited");
      }
      link.addEventListener("click", function () {
        localStorage.setItem(this.href, "visited");
        this.classList.add("visited");
      });
    });
  });
</script>
{{end}}
