<div class="helpbox" id="help" hidden>
  <div class="helpcard" role="dialog" aria-label="Keyboard shortcuts">
    <h3>Shortcuts</h3>
    <dl>
      <dt>j / k</dt><dd>next / prev</dd>
      <dt>enter</dt><dd>read here</dd>
      <dt>o</dt><dd>open original</dd>
      <dt>f</dt><dd>fav / unfav</dd>
      <dt>e</dt><dd>mark read</dd>
      <dt>u</dt><dd>undo</dd>
      <dt>/</dt><dd>search (Explore)</dd>
      <dt>esc</dt><dd>back to list</dd>
      <dt>g h</dt><dd>go home</dd>
      <dt>g f</dt><dd>go to feeds</dd>
    </dl>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>
{{end}}
