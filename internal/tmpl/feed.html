<!DOCTYPE html>
<html lang="en">
  <head>
    {{template "head" .}}
    <script>
      function getFile() {
        document.getElementById("upfile").click();
      }

      function sub() {
        document.fileForm.submit();
      }

      function switchCategory(category, updateURL = true) {
        let visibleCount = 0;

        document.querySelectorAll(".category-tab").forEach((tab) => {
          tab.classList.toggle("active", tab.dataset.category === category);
        });

        document.querySelectorAll(".feed-item").forEach((feed) => {
          const feedCategory = feed.dataset.category || "";
          const visible = category === "all" ||
            (category === "inbox" ? feedCategory === "" : feedCategory === category);
          feed.hidden = !visible;
          if (visible) visibleCount++;
        });

        const empty = document.getElementById("feeds-empty");
        if (empty) empty.hidden = visibleCount !== 0;

        if (updateURL) {
          const url = new URL(window.location);
          if (category === "inbox") {
            url.searchParams.delete("category");
          } else {
            url.searchParams.set("category", category);
          }
          window.history.replaceState({}, "", url);
        }
      }

      document.addEventListener("DOMContentLoaded", function () {
        const tabs = document.querySelector(".category-tabs");
        const initialCategory = tabs ? tabs.dataset.currentCategory : "inbox";

        document.querySelectorAll(".category-tab").forEach((tab) => {
          tab.addEventListener("click", function () {
            switchCategory(this.dataset.category);
          });
        });

        switchCategory(initialCategory, false);
      });
    </script>
  </head>
  <body>
    {{template "nav" .}}
    <h1>Feeds</h1>

    <div class="import-export-container">
      <form action="/feed/import" method="POST" enctype="multipart/form-data" name="fileForm">
        <button type="button" onclick="getFile()" class="import-button">(+import)</button>
        <input id="upfile" type="file" value="opml" name="opml" onchange="sub()" />
      </form>
      <form method="GET" action="/feed/export">
        <button type="submit" class="export-button">(+export)</button>
      </form>
    </div>

    <form method="POST" action="/feed/add" class="form-container">
      <label for="url">Enter Feed URL:</label>
      <input type="url" id="url" name="url" required />
      <input type="submit" value="Add" />
    </form>
    <hr />

    <div class="category-tabs" data-current-category="{{if eq .CurrentCategory ""}}inbox{{else}}{{.CurrentCategory}}{{end}}">
      <button type="button" class="category-tab" data-category="inbox">Inbox</button>
      <button type="button" class="category-tab" data-category="all">All</button>
      {{range $cat := .Categories}}
      <button type="button" class="category-tab" data-category="{{$cat.Name}}">
        <span class="tab-color" style="background-color: {{$cat.Color}};"></span>
        {{$cat.Name}}{{if not $cat.Email}}<span class="system-marker">*</span>{{end}}
      </button>
      {{end}}
    </div>

    <div class="feed-list">
      {{range $feed := .AllFeeds}}
      <div class="feed-item" data-category="{{$feed.Categories}}">
        <a href="/feed/{{$feed.ID}}" class="feed-title">{{$feed.Title}}</a>
        <a href="{{$feed.URL}}" target="_blank" class="feed-url">{{$feed.URL}}</a>
        <div class="feed-actions">
          <form method="POST" action="/feed/{{$feed.ID}}/category">
            <select name="category" class="category-select" onchange="this.form.submit()" aria-label="Category for {{$feed.Title}}">
              <option value="">Uncategorized</option>
              {{range $cat := $.Categories}}
              <option value="{{$cat.Name}}" {{if eq $feed.Categories $cat.Name}}selected{{end}}>{{$cat.Name}}</option>
              {{end}}
            </select>
          </form>
          <form method="POST" action="/feed/delete/{{$feed.ID}}">
            <button type="submit" class="delete-button" title="Delete feed">(-)</button>
          </form>
        </div>
      </div>
      {{end}}
    </div>

    <p id="feeds-empty" class="empty-state" hidden>No feeds in this category.</p>
  </body>
</html>
