<!DOCTYPE html>
<html lang="en">
  <head>
    {{template "head" .}}
    <script>
      function getFile() {
        document.getElementById("upfile").click();
      }

      function sub(obj) {
        document.fileForm.submit();
        event.preventDefault();
      }
    </script>
  </head>
  <body>
    {{template "nav" .}}
    <h1>Feeds</h1>
    <div class="import-export-container">
      <form action="/feed/import" method="POST" enctype="multipart/form-data" name="fileForm">
        <div id="importbtn" onclick="getFile()" class="import-button">(+import)</div>
        <div style="height: 0px; width: 0px; overflow: hidden">
          <input id="upfile" type="file" value="opml" name="opml" onchange="sub(this)" />
        </div>
      </form>
      <form method="GET" action="/feed/export">
        <button type="submit" class="export-button">(+export)</button>
      </form>
    </div>
    <form method="POST" action="/feed/add" class="form-container">
      <label for="url">Enter Feed URL:</label>
      <input type="text" id="url" name="url" required />
      <input type="submit" value="Add Feed" />
    </form>
    <hr />
    {{range $idx, $feed := .Feeds}}
    <div class="feed-item">
      <div class="feed-header">
        <a href="/feed/{{$feed.ID}}" class="feed-title">{{$feed.Title}}</a>
        <div class="feed-actions">
          <form
            method="POST"
            action="/feed/delete/{{$feed.ID}}"
            style="display: inline"
          >
            <button type="submit" class="delete-button">(-)</button>
          </form>
          <form
            method="POST"
            action="/feed/{{$feed.ID}}/category"
            style="display: inline; margin-left: 10px;"
          >
            <select name="category" class="category-select" onchange="this.form.submit()">
              <option value="">No Category</option>
              {{range $cat := $.Categories}}
              <option value="{{$cat.Name}}" {{if eq $feed.Categories $cat.Name}}selected{{end}}>{{$cat.Name}}</option>
              {{end}}
            </select>
          </form>
        </div>
      </div>
      <div class="feed-url">{{$feed.URL}}</div>
    </div>
    {{end}}
  </body>
  <style>
    .feed-item {
      padding: 10px;
      border-bottom: 1px solid #eee;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .feed-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .feed-title {
      font-weight: bold;
      font-size: 16px;
      flex: 1;
    }

    .feed-actions {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .feed-url {
      color: #666;
      font-size: 14px;
    }

    .category-select {
      padding: 3px 6px;
      border: 1px solid #ccc;
      border-radius: 3px;
      background: white;
      font-size: 14px;
      cursor: pointer;
    }

    .category-select:hover {
      border-color: #999;
    }

    /* Dark mode styles */
    @media (prefers-color-scheme: dark) {
      .feed-item {
        border-color: #4a5568;
      }

      .feed-url {
        color: #a0aec0;
      }

      .category-select {
        background: #4a5568;
        border-color: #718096;
        color: #e2e8f0;
      }

      .category-select:hover {
        border-color: #a0aec0;
      }
    }
  </style>
</html>
